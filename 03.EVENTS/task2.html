<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetTimeInterval</title>
</head>

<body>
    <h1>Set Time Interval</h1>
    <button id="btn">STOP</button>
</body>
<script>

//    TASK: change the h1 after a interval if not clicked on stop button 

//setTimeout : perform task once
// setInterval : repeat task within an interval
// clearTimeOut: 

    const sayMyName = function(){
        console.log("legendKS");
    }

    //setTimeout(sayMyName, 2000);
    //setInterval(sayMyName, 2000);



    const changeText =  function(){
        document.querySelector('h1').innerHTML = "Yey! You changed me. ";
      
    }
    const changeH1 = setInterval(changeText,3000);
     
    document.querySelector('#btn').addEventListener('click', function(){
            clearTimeout(changeH1);
            console.log("Stopped!");
            
    });


</script>
</html>
