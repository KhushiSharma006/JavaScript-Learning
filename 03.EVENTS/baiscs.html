<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTS</title>
    <style>   
        body{
            background-color: black;

        }
    </style>
</head>
<body>
    <ul  id="images">
        <li><img id="img1" width="200px"  src="https://picsum.photos/seed/picsum/200/300"></li>
        <li><img id="img2" width="200px" src="https://picsum.photos/id/870/200/300?grayscale&blur=2"></li>
        <li><img id="img3" width="200px" src="https://picsum.photos/200/300?random=2"></li>
         <li>
            <a href="https://google.com" id="google" style="color:aliceblue">Google</a>
         </li>
    </ul>
</body>

<script>
   /*Importent Events:

    type, timestamp, defaultPrevented
    target, toElement, srcElement, currentTarget
    clientX, clientY, screenX, screenY
     altkey, ctrlkey, shiftkey, keycode*/


  /*context of event propogation: 1. Event capturing =>true
                                   2. Event bubbling(default) => false (bubble down to up)
  */
  
    document.getElementById('images').addEventListener('click', function(e){
        console.log("clicked inside the ul");
    },false);
  
    document.getElementById('img2').addEventListener('click', function(e){
        console.log("img2 clicked");
        e.stopPropagation(); // event stop bubbling upwards
    },false);


    //change default behavior
    document.getElementById('google').addEventListener('click', function(e){
        e.preventDefault;
        e.stopPropagation(); 
        console.log("google clicked");
    },false)
  

</script>
</html>
